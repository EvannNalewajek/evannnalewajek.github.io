<div class="home-container">
  
  <!-- Background Decor -->
  <div class="synthwave-bg">
    <div class="sun"></div>
    <div class="particles">
        @for (p of [].constructor(20); track $index) {
            <div class="particle"></div>
        }
    </div>
    <div class="grid-container">
      <div class="grid"></div>
    </div>
    <div class="scanlines"></div>
  </div>

  <!-- Navbar -->
  <mat-toolbar color="primary" class="navbar">
    <span class="logo">✨ Le bordel dans ma tête mais avec des paillettes ^^</span>
    <span class="spacer"></span>
  </mat-toolbar>

  <!-- Titre -->
  <header class="welcome">
    <h1>Bibliothèque</h1>
  </header>

  <!-- Carrousel -->
  <div class="container">
    <swiper-container
  class="mySwiper"
  slides-per-view="auto"
  centered-slides="true"
  effect="coverflow"
  autoplay-delay="3000"
  autoplay-disable-on-interaction="false"
  coverflow-effect-rotate="25"
  coverflow-effect-stretch="0"
  coverflow-effect-depth="100"
  coverflow-effect-modifier="1"
  pagination="true"
  navigation="true"
>
  <swiper-slide>
    <div class="carousel-item theme-idle">
      <h2>Idle Game</h2>
      <a [routerLink]="['/guilde']" mat-raised-button>
        Jouer
      </a>
    </div>
  </swiper-slide>
  <swiper-slide>
    <div class="carousel-item theme-enigme">
      <h2>Énigme</h2>
      <a [routerLink]="['/enigmemain']" mat-raised-button>
        Jouer
      </a>
    </div>
  </swiper-slide>
  <swiper-slide>
    <div class="carousel-item theme-pokedex">
      <h2>Pokédex</h2>
      <a [routerLink]="['/pokedex']" mat-raised-button>
        Consulter
      </a>
    </div>
  </swiper-slide>
  <swiper-slide>
    <div class="carousel-item theme-detective">
      <h2>Détective</h2>
      <a [routerLink]="['/detective']" mat-raised-button>
        Enquêter
      </a>
    </div>
  </swiper-slide>
  <!-- Slides futurs -->
</swiper-container>
</div>
