<div class="dex-scene">
    <div class="dex-card">
        <div class="dex-header">
            <div class="dex-button" aria-hidden="true"></div>
            <div class="dex-lights" aria-hidden="true">
                <span class="led led-red"></span>
                <span class="led led-yellow"></span>
                <span class="led led-green"></span>
            </div>
            <h1>Menu Principal</h1>
        </div>

        <div class="dex-body">
            <div class="dex-screen pokedex-main-menu">
                <a class="menu-card card-pokemon" routerLink="/pokedex/pokemons">
                    <span class="icon">🧬</span>
                    <span class="title">Pokémons</span>
                    <span class="desc">Consulter le Pokédex complet</span>
                </a>
                <a class="menu-card card-moves" routerLink="/pokedex/moves">
                    <span class="icon">⚡</span>
                    <span class="title">Capacités</span>
                    <span class="desc">Liste des attaques et de leurs effets</span>
                </a>
                <a class="menu-card card-abilities" routerLink="/pokedex/abilities">
                    <span class="icon">✨</span>
                    <span class="title">Talents</span>
                    <span class="desc">Liste de tous les effets passifs</span>
                </a>
                <a class="menu-card card-docs" routerLink="/pokedex/docs">
                    <span class="icon">📘</span>
                    <span class="title">Documentations</span>
                    <span class="desc">Règles, mécaniques et documentations</span>
                </a>
            </div>
        </div>
    </div>
</div>
